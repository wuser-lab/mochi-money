name: MochiMoney
options:
  bundleIdPrefix: dev.wwwwwwww
  deploymentTarget:
    iOS: '17.0'
targets:
  MochiMoney:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Sources/Models.swift
      - path: Sources/CSVCodec.swift
      - path: Sources/ImportRules.swift
      - path: Sources/BankMerge.swift
      - path: Sources/BankSync.swift
      - path: Sources/FlowPlanner.swift
      - path: Sources/FlowCoachView.swift
    entitlements:
      path: iOS/MochiMoney.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        MOCHI_API_BASE_URL: ""
        INFOPLIST_KEY_MochiAPIBaseURL: "$(MOCHI_API_BASE_URL)"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: W Money
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.wwwwwwww.mochimoney
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: W Money
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
